# Render Blueprint for the engine. In Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: rhyme-hero-engine
    runtime: python
    rootDir: engine
    plan: starter
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      # Set to the Vercel address of the web app, e.g. https://rhyme-hero.vercel.app
      - key: RHYME_HERO_CORS_ORIGINS
        sync: false
