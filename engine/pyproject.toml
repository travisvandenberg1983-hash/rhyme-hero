[project]
name = "rhyme-hero-engine"
version = "0.1.0"
description = "Rhyme Hero coaching engine - word banks, rhyme patterns and stress, never finished lines."
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    # Plain uvicorn (not [standard]): its optional C extensions have no Windows ARM64 wheels.
    "uvicorn>=0.34",
    "pronouncing>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
